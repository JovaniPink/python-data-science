name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .
      - run: uv run --locked mypy src
      - run: uv run --locked pytest
      - run: uv run --locked marimo check --strict notebooks/bls_macro_clustering.py
      - run: uv build --no-build-isolation --clear
      - name: Audit locked dependencies
        run: |
          uv export --quiet --locked --no-dev --no-emit-project \
            --format requirements-txt \
            --output-file /tmp/python-data-science-runtime.txt
          uv run --locked pip-audit --disable-pip --require-hashes \
            -r /tmp/python-data-science-runtime.txt
          uv export --quiet --locked --all-groups --no-emit-project \
            --format requirements-txt \
            --output-file /tmp/python-data-science-all.txt
          uv run --locked pip-audit --disable-pip --require-hashes \
            -r /tmp/python-data-science-all.txt
