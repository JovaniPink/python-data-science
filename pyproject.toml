[project]
name = "python-data-science"
version = "0.1.0"
description = "Rights-aware, reproducible Python data-science experiments"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
authors = [{ name = "Jovani Pink" }]
dependencies = [
  "altair>=6.2.2,<7",
  "httpx>=0.28.1,<1",
  "marimo>=0.23.15,<1",
  "numpy>=2.5.1,<3",
  "polars>=1.43.1,<2",
  "scikit-learn>=1.9.0,<2",
]

[project.scripts]
bls-macro-clustering = "python_data_science.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "mypy>=2.3.0,<3",
  "pip-audit>=2.10.1,<3",
  "pytest>=9.1.1,<10",
  "ruff>=0.16.0,<1",
  "uv_build>=0.12.3,<0.13",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["E402"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
